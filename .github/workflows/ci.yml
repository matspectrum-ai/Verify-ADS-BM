name: CI

on:
  push:
    branches:
      - main
      - reconstruction/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture public target evidence
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/capture-target-public.mjs

      - name: Upload public target evidence
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: target-public-evidence
          path: target-evidence
          if-no-files-found: error
          retention-days: 7

      - name: E2E public contract
        run: npm run test:e2e -- --project=chromium

      - name: Upload local visual evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: local-public-evidence
          path: local-evidence
          if-no-files-found: error
          retention-days: 7
